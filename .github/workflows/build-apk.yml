name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK روی runner از قبل نصب است؛ فقط لایسنس‌ها را می‌پذیریم
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk sedanegar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sedanegar-apk
          path: sedanegar.apk

      # APK را به‌صورت Release منتشر می‌کند تا از صفحه‌ی Releases مستقیم دانلود شود
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" sedanegar.apk \
            --title "صدانگار - ساخت ${{ github.run_number }}" \
            --notes "فایل نصبی اندروید. روی گوشی دانلود و نصب کنید."
