<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E8EFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1819" media="(prefers-color-scheme: dark)">
<title>صدانگار</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B7F7A'/%3E%3Cpath d='M18 26v12M26 18v28M34 22v20M42 28v8M50 24v16' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Layout: one-handed phone app. Recorder "tape window" on top, big round control below, two tabs at the bottom. */
:root{
  --font:Vazirmatn,"IRANSansX","IRANSans","Noto Sans Arabic UI","Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --ground:#E8EFEC; --surface:#F7FAF8; --ink:#10292B; --ink-2:#51696B; --line:#C9D8D4;
  --teal:#0B7F7A; --on-teal:#FFFFFF;
  --rec:#D12F4B; --on-rec:#FFFFFF; --rec-soft:rgba(209,47,75,.18);
  --saffron:#E9A21B; --saffron-soft:rgba(233,162,27,.24);
  --wave:#0B7F7A; --wave-dim:#A9C4C0;
  --shadow:0 10px 30px rgba(16,41,43,.10);
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0C1819; --surface:#132628; --ink:#E3EFEC; --ink-2:#8FABA8; --line:#254140;
    --teal:#3CC4BA; --on-teal:#052220;
    --rec:#FF5C78; --on-rec:#2B0710; --rec-soft:rgba(255,92,120,.22);
    --saffron:#F4B93E; --saffron-soft:rgba(244,185,62,.24);
    --wave:#3CC4BA; --wave-dim:#2D5855;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.7 var(--font);overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}

.app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 4px}
.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:800}
.brand svg{width:34px;height:34px}
.view{flex:1;overflow-y:auto;padding:6px 20px 24px;-webkit-overflow-scrolling:touch}

/* quality chips */
.qual{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.chip.on{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.chip:disabled{opacity:.55}
.qual-hint{margin:8px 2px 0;font-size:14.5px;color:var(--ink-2)}
.banner{margin:10px 0 0;padding:12px 14px;border-radius:14px;background:var(--saffron-soft);font-size:15px}

/* recorder stage */
.stage{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:18px 16px 14px;box-shadow:var(--shadow);text-align:center}
.status{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2)}
.status::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--wave-dim)}
[data-state=rec] .status::before{background:var(--rec);animation:blink 1.2s ease-in-out infinite}
[data-state=paused] .status::before{background:var(--saffron)}
@keyframes blink{50%{opacity:.25}}
.clock{direction:ltr;font-size:62px;font-weight:700;line-height:1.15;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:4px 0 2px}
.live{width:100%;height:96px;display:block;direction:ltr}
.size-line{min-height:1.7em;font-size:15px;color:var(--ink-2);margin-top:4px}

.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;margin-top:26px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15px;color:var(--ink-2);text-align:center}
.ctl.main{position:relative}
.rbtn{display:grid;place-items:center;border-radius:50%;transition:transform .12s}
.rbtn:active{transform:scale(.95)}
.rbtn svg{width:30px;height:30px}
.rbtn.big{width:108px;height:108px;background:var(--rec);color:var(--on-rec);position:relative;z-index:1;box-shadow:0 12px 28px var(--rec-soft)}
.rbtn.big svg{width:46px;height:46px}
[data-state=paused] .rbtn.big{background:var(--teal);color:var(--on-teal)}
.rbtn.small{width:62px;height:62px;border:2px solid var(--ink);background:var(--surface)}
.halo{position:absolute;top:0;left:50%;width:108px;height:108px;margin-left:-54px;border-radius:50%;background:var(--rec-soft);opacity:0;transform:scale(calc(1 + var(--lvl,0) * .6));transition:transform .09s linear}
[data-state=rec] .halo{opacity:1}
.linkbtn{min-height:48px;padding:0 8px;color:var(--ink-2);text-decoration:underline;text-underline-offset:4px}
.hint{min-height:1.6em;text-align:center;font-size:14.5px;color:var(--ink-2);margin:18px 0 0}

/* library */
.search{width:100%;min-height:50px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px}
.summary{margin:10px 2px 4px;font-size:14.5px;color:var(--ink-2)}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;width:100%;text-align:start;padding:14px 2px;border-bottom:1px solid var(--line)}
.row .pl{width:54px;height:54px;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center}
.row .pl svg{width:24px;height:24px}
.row .nm{font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:14px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap}
.row .body{min-width:0}
.row canvas{width:100%;height:26px;display:block;direction:ltr;margin-top:4px}
.empty{text-align:center;color:var(--ink-2);padding:48px 12px}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:4px}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--ground)}
.tab{min-height:54px;border-radius:16px;font-weight:700;color:var(--ink-2);position:relative}
.tab[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -3px 0 var(--saffron)}
.dot{position:absolute;top:12px;inset-inline-end:26%;width:10px;height:10px;border-radius:50%;background:var(--rec)}

/* sheets */
.overlay{position:fixed;inset:0;background:rgba(4,14,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .18s}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:21px}
.sheet .sub{margin:0 0 14px;color:var(--ink-2);font-size:15px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.field{width:100%;min-height:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--ground);padding:0 16px;font-size:18px}
.stack{display:grid;gap:10px;margin-top:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:54px;border-radius:16px;font-weight:700;padding:0 16px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn.danger{border-color:var(--rec);color:var(--rec)}
.btn.danger.sure{background:var(--rec);color:var(--on-rec)}
.btn:disabled{opacity:.5}

/* waveform + player */
.wavebox{position:relative;direction:ltr;height:120px;border-radius:18px;background:var(--ground);overflow:hidden;touch-action:none}
.wavebox canvas{width:100%;height:100%;display:block}
.times{direction:ltr;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:15px;margin:8px 2px 0}
.transport{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0 6px;direction:ltr}
.round{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:16px;background:var(--surface)}
.round.big{width:76px;height:76px;background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.round.big svg{width:34px;height:34px}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.8;pointer-events:none}
.band{position:absolute;top:0;bottom:0;background:var(--saffron-soft);pointer-events:none}
.hdl{position:absolute;top:0;bottom:0;width:44px;margin-left:-22px;touch-action:none;cursor:ew-resize;display:grid;place-items:center}
.hdl::before{content:"";width:4px;height:100%;background:var(--saffron);border-radius:2px}
.hdl::after{content:"";position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--saffron);border:3px solid var(--surface)}
.trimrow{direction:ltr;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.trimcol{background:var(--ground);border-radius:16px;padding:10px;text-align:center;direction:rtl}
.trimcol .lbl{font-size:14px;color:var(--ink-2)}
.trimcol .val{font-size:22px;font-weight:700;direction:ltr;font-variant-numeric:tabular-nums}
.nudge{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;direction:ltr}
.nudge button{min-height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--ground);padding:5px;border-radius:16px;margin-bottom:12px}
.seg button{min-height:46px;border-radius:12px;font-weight:700;color:var(--ink-2)}
.seg button[aria-checked=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.bar{height:12px;border-radius:6px;background:var(--ground);overflow:hidden;margin:18px 0 10px}
.bar i{display:block;height:100%;width:0;background:var(--teal);border-radius:6px;transition:width .2s linear}
.result{margin:12px 2px 0;font-size:15.5px;color:var(--ink-2);text-align:center}

#toast{position:fixed;inset-inline:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:80;display:flex;justify-content:center;pointer-events:none}
#toast span{background:var(--ink);color:var(--ground);padding:12px 18px;border-radius:14px;font-size:16px;box-shadow:var(--shadow);animation:fade .2s}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="var(--teal)"/><g stroke-width="5" stroke-linecap="round" stroke="#fff"><path d="M16 27v10M24 20v24M32 14v36" /><path d="M40 20v24M48 27v10"/></g><path d="M32 14v36" stroke="var(--saffron)" stroke-width="5" stroke-linecap="round"/></svg>
      <span>صدانگار</span>
    </div>
  </header>

  <main style="display:contents">
    <section id="viewRec" class="view" data-state="idle">
      <div class="qual" id="qual" role="radiogroup" aria-label="کیفیت ضبط"></div>
      <p class="qual-hint" id="qualHint"></p>
      <div class="banner" id="banner" hidden></div>

      <div class="stage">
        <div class="status" id="status" aria-live="polite">آماده ضبط</div>
        <div class="clock" id="clock">۰۰:۰۰</div>
        <canvas class="live" id="live" aria-hidden="true"></canvas>
        <div class="size-line" id="sizeLine"></div>
      </div>

      <div class="controls">
        <div class="ctl" id="stopWrap" style="visibility:hidden">
          <button class="rbtn small" id="btnStop" aria-label="پایان و ذخیره"></button>
          <span>پایان و ذخیره</span>
        </div>
        <div class="ctl main">
          <div class="halo" id="halo"></div>
          <button class="rbtn big" id="btnMain" aria-label="شروع ضبط"></button>
          <span id="mainLabel">شروع ضبط</span>
        </div>
        <div class="ctl" id="cancelWrap" style="visibility:hidden">
          <button class="linkbtn" id="btnCancel">دور انداختن</button>
        </div>
      </div>
      <p class="hint" id="recHint"></p>
    </section>

    <section id="viewLib" class="view" hidden>
      <input class="search" id="search" type="search" placeholder="جست‌وجو در نام ضبط‌ها" aria-label="جست‌وجو">
      <div class="summary" id="summary"></div>
      <ul class="list" id="list"></ul>
      <div class="empty" id="empty" hidden><b>هنوز ضبطی ندارید</b>اولین ضبط را از تب «ضبط» بسازید.</div>
    </section>
  </main>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabRec" aria-selected="true">ضبط<i class="dot" id="tabDot" hidden></i></button>
    <button class="tab" role="tab" id="tabLib" aria-selected="false">ضبط‌شده‌ها <span id="count"></span></button>
  </nav>
</div>
<div id="sheetRoot"></div>
<div id="toast" aria-live="polite"></div>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const PEAK_HZ=4;
const QUAL=[
  {id:'small',label:'کم‌حجم',bps:20000,hint:'برای صحبت، جلسه و کلاس کافی و شفاف است'},
  {id:'balanced',label:'متعادل',bps:32000,hint:'کمی دقیق‌تر؛ مناسب گفتگو و صدای محیط'},
  {id:'high',label:'باکیفیت',bps:64000,hint:'برای موسیقی و صدای باکیفیت‌تر'}
];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- small helpers ---------- */
function h(tag,props,...kids){
  const e=document.createElement(tag);
  if(props)for(const k in props){
    const v=props[k];
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}
  return e;
}
const nf=new Intl.NumberFormat('fa-IR');
const nf1=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:1});
const fa=n=>nf.format(n);
const dfDay=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'long',day:'numeric'});
const dfFull=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'});
const dfTime=new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit',hour12:false});
function p2(v){return v<10?'۰'+fa(v):fa(v)}
function fmtClock(s){s=Math.max(0,Math.floor(s));const hh=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return hh?`${fa(hh)}:${p2(m)}:${p2(x)}`:`${p2(m)}:${p2(x)}`}
function fmtSize(b){return b<1048576?`${fa(Math.max(1,Math.round(b/1024)))} کیلوبایت`:`${nf1.format(b/1048576)} مگابایت`}
function defaultName(ts){return `ضبط ${dfDay.format(ts)} – ${dfTime.format(ts)}`}
function norm(s){return String(s).replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase()}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function safeName(n){return (n||'ضبط').replace(/[\\/:*?"<>|]+/g,'-').trim()||'ضبط'}
function extOf(m){m=m||'';return m.includes('mp4')?'m4a':m.includes('ogg')?'ogg':'webm'}
function pickMime(){
  const c=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm'];
  for(const m of c){try{if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m}catch(e){}}
  return '';
}
let toastTimer=0;
function toast(msg){const t=$('#toast');t.replaceChildren(h('span',null,msg));clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.replaceChildren(),2600)}

const SV='viewBox="0 0 24 24" aria-hidden="true"';
const ST=`${SV} fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;
const FL=`${SV} fill="currentColor"`;
const ICONS={
  mic:`<svg ${ST}><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`,
  pause:`<svg ${FL}><rect x="6" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg>`,
  play:`<svg ${FL}><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.3-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z"/></svg>`,
  stop:`<svg ${FL}><rect x="6" y="6" width="12" height="12" rx="2.6"/></svg>`,
  cut:`<svg ${ST}><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg>`,
  share:`<svg ${ST}><path d="M12 15V3M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h14"/></svg>`,
  save:`<svg ${ST}><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>`,
  trash:`<svg ${ST}><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>`,
  pen:`<svg ${ST}><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/></svg>`
};
function ico(n){return h('span',{html:ICONS[n],style:'display:contents'})}

/* ---------- IndexedDB ---------- */
const dbp=new Promise((res,rej)=>{
  if(!window.indexedDB){rej(new Error('no-idb'));return}
  const r=indexedDB.open('sedanegar',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('recs',{keyPath:'id'});d.createObjectStore('chunks',{keyPath:'id'});d.createObjectStore('draft',{keyPath:'sid'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});
dbp.catch(()=>{});
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function os(n,m){return (await dbp).transaction(n,m||'readonly').objectStore(n)}
const idb={
  put:async(n,v)=>rq((await os(n,'readwrite')).put(v)),
  get:async(n,k)=>rq((await os(n)).get(k)),
  all:async n=>rq((await os(n)).getAll()),
  del:async(n,k)=>rq((await os(n,'readwrite')).delete(k)),
  range:async(n,lo,hi)=>rq((await os(n)).getAll(IDBKeyRange.bound(lo,hi))),
  delRange:async(n,lo,hi)=>rq((await os(n,'readwrite')).delete(IDBKeyRange.bound(lo,hi)))
};
async function clearDraft(sid){try{await idb.del('draft',sid);await idb.delRange('chunks',sid+':',sid+':￿')}catch(e){}}

/* ---------- colors & canvas ---------- */
const C={};
function readColors(){const s=getComputedStyle(document.documentElement);for(const k of ['wave','wave-dim','saffron','rec','teal','ink','ink-2'])C[k]=s.getPropertyValue('--'+k).trim()}
function fitCanvas(c){
  const dpr=Math.min(window.devicePixelRatio||1,3),r=c.getBoundingClientRect();
  const w=Math.max(1,Math.round(r.width*dpr)),hh=Math.max(1,Math.round(r.height*dpr));
  if(c.width!==w||c.height!==hh){c.width=w;c.height=hh}
  return {w,h:hh,dpr};
}
function rrect(g,x,y,w,hh,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+hh,r);g.arcTo(x+w,y+hh,x,y+hh,r);g.arcTo(x,y+hh,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function barsFrom(peaks,n){
  const out=new Array(n),L=peaks.length;
  for(let i=0;i<n;i++){
    if(!L){out[i]=0;continue}
    const a=Math.floor(i*L/n),b=Math.max(a+1,Math.floor((i+1)*L/n));
    let m=0;for(let j=a;j<b&&j<L;j++){const v=peaks[j]||0;if(v>m)m=v}
    out[i]=m/255;
  }
  return out;
}
function drawBars(c,peaks,colorAt,o={}){
  const {w,h:hh,dpr}=fitCanvas(c),g=c.getContext('2d');
  g.clearRect(0,0,w,hh);
  const bw=(o.bw||3)*dpr,gap=(o.gap||2)*dpr,n=Math.max(1,Math.floor((w+gap)/(bw+gap)));
  const bars=barsFrom(peaks,n),x0=(w-(n*(bw+gap)-gap))/2,mid=hh/2;
  for(let i=0;i<n;i++){
    const bh=Math.max(bw,bars[i]*hh*0.9);
    g.fillStyle=colorAt(i/n);
    rrect(g,x0+i*(bw+gap),mid-bh/2,bw,bh,bw/2);g.fill();
  }
}

/* ---------- state ---------- */
const S={q:store.get('q','small'),libs:[],tab:'rec'};
if(!QUAL.some(q=>q.id===S.q))S.q='small';
let R=null,starting=false,wake=null;

function unsupported(){
  if(!window.isSecureContext||!navigator.mediaDevices)return 'برای استفاده از میکروفون، این صفحه باید با آدرس امن (https) باز شود. فایل را روی یک هاست https بگذارید و از همان آدرس باز کنید.';
  if(!window.MediaRecorder)return 'مرورگر شما ضبط صدا را پشتیبانی نمی‌کند. مرورگر را به‌روزرسانی کنید (در آیفون: iOS نسخه ۱۴٫۳ به بالا).';
  return null;
}

/* ---------- wake lock ---------- */
async function requestWake(){
  try{if(window.NativeBridge)NativeBridge.keepAwake(true)}catch(e){}
  try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}catch(e){}
}
function releaseWake(){
  try{if(window.NativeBridge)NativeBridge.keepAwake(false)}catch(e){}
  try{wake&&wake.release()}catch(e){}wake=null;
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){if(R&&R.state==='rec')requestWake()}
  else saveDraftNow();
});
window.addEventListener('pagehide',saveDraftNow);

/* ---------- recorder ---------- */
function elapsed(){return R?R.accum+(R.state==='rec'?(performance.now()-R.segStart)/1000:0):0}
function saveDraftNow(){
  if(!R)return;
  R.lastDraft=performance.now();
  idb.put('draft',{sid:R.sid,mime:R.mime,bps:R.bps,created:R.created,duration:elapsed(),peaks:R.peaks.slice()}).catch(()=>{});
}
function onChunk(r,e){
  if(!e.data||!e.data.size)return;
  r.chunks.push(e.data);r.size+=e.data.size;
  idb.put('chunks',{id:r.sid+':'+String(r.seq++).padStart(6,'0'),sid:r.sid,blob:e.data}).catch(()=>{});
}
async function startRec(){
  if(R||starting)return;
  const why=unsupported();
  if(why){info('امکان ضبط نیست',why);return}
  starting=true;
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){starting=false;micError(e);return}
  try{
    const mime=pickMime(),q=QUAL.find(x=>x.id===S.q);
    let mr;
    try{mr=new MediaRecorder(stream,{mimeType:mime||undefined,audioBitsPerSecond:q.bps})}catch(e){mr=new MediaRecorder(stream)}
    const r=R={stream,mr,mime:mr.mimeType||mime||'audio/webm',bps:q.bps,chunks:[],sid:'s'+Date.now().toString(36),seq:0,accum:0,segStart:performance.now(),state:'rec',peaks:[],live:[],liveT:0,size:0,lvl:0,created:Date.now(),lastDraft:0,raf:0};
    mr.ondataavailable=e=>onChunk(r,e);
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      r.ctx=new AC();try{r.ctx.resume()}catch(e){}
      const src=r.ctx.createMediaStreamSource(stream);
      r.an=r.ctx.createAnalyser();r.an.fftSize=1024;src.connect(r.an);
      r.buf=new Float32Array(r.an.fftSize);
    }catch(e){r.an=null}
    mr.start(2000);
    requestWake();saveDraftNow();
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
    renderRecUI();loop();
    try{if(window.NativeBridge)NativeBridge.recording(true)}catch(e){}
  }catch(e){
    stream.getTracks().forEach(t=>t.stop());R=null;renderRecUI();
    info('ضبط شروع نشد','مشکلی در راه‌اندازی ضبط پیش آمد. صفحه را دوباره باز کنید.');
  }
  starting=false;
}
function pauseRec(){
  if(!R||R.state!=='rec')return;
  R.accum+=(performance.now()-R.segStart)/1000;R.state='paused';
  try{R.mr.pause()}catch(e){}
  saveDraftNow();renderRecUI();
}
function resumeRec(){
  if(!R||R.state!=='paused')return;
  try{R.mr.resume()}catch(e){}
  R.segStart=performance.now();R.state='rec';requestWake();renderRecUI();
}
function teardown(r){
  cancelAnimationFrame(r.raf);
  try{r.stream.getTracks().forEach(t=>t.stop())}catch(e){}
  try{r.ctx&&r.ctx.close()}catch(e){}
  try{if(window.NativeBridge)NativeBridge.recording(false)}catch(e){}
  releaseWake();
}
function stopRec(){
  const r=R;if(!r)return;
  if(r.state==='rec')r.accum+=(performance.now()-r.segStart)/1000;
  r.state='stopped';
  let done=false;
  const fin=()=>{if(done)return;done=true;teardown(r);R=null;renderRecUI();finishRec(r)};
  r.mr.onstop=fin;
  try{r.mr.stop()}catch(e){fin()}
  setTimeout(fin,3000);
}
function discardRec(){
  const r=R;if(!r)return;
  r.mr.onstop=null;r.mr.ondataavailable=null;
  try{r.mr.stop()}catch(e){}
  teardown(r);R=null;clearDraft(r.sid);renderRecUI();toast('ضبط دور انداخته شد');
}
function finishRec(r){
  const blob=new Blob(r.chunks,{type:r.mime});
  if(!blob.size||r.accum<0.3){clearDraft(r.sid);info('ضبطی ثبت نشد','ضبط خیلی کوتاه بود. دوباره امتحان کنید.');return}
  r.peaks.length=Math.min(r.peaks.length,Math.ceil(r.accum*PEAK_HZ)+1);
  openSave({blob,duration:r.accum,peaks:r.peaks,mime:r.mime,bps:r.bps,created:r.created,sid:r.sid});
}
function loop(){
  const r=R;if(!r)return;
  const t=elapsed(),now=performance.now();
  if(r.state==='rec'){
    let v=0;
    if(r.an){
      r.an.getFloatTimeDomainData(r.buf);
      let p=0;for(let i=0;i<r.buf.length;i++){const a=Math.abs(r.buf[i]);if(a>p)p=a}
      v=Math.min(1,Math.pow(p*2.2,0.6));
    }
    r.lvl=Math.max(v,r.lvl*0.9);
    const slot=Math.floor(t*PEAK_HZ);
    while(r.peaks.length<=slot)r.peaks.push(0);
    const b=Math.round(v*255);if(b>r.peaks[slot])r.peaks[slot]=b;
    if(now-r.liveT>70){r.liveT=now;r.live.push(r.lvl);if(r.live.length>400)r.live.shift()}
  }else r.lvl*=0.8;
  $('#clock').textContent=fmtClock(t);
  $('#sizeLine').textContent=r.size?`حجم تا الان: ${fmtSize(r.size)}`:'';
  $('#halo').style.setProperty('--lvl',r.lvl.toFixed(3));
  drawLive();
  if(now-r.lastDraft>5000)saveDraftNow();
  r.raf=requestAnimationFrame(loop);
}
function drawLive(){
  const c=$('#live'),{w,h:hh,dpr}=fitCanvas(c),g=c.getContext('2d');
  g.clearRect(0,0,w,hh);
  const bw=3*dpr,gap=3*dpr,n=Math.floor((w+gap)/(bw+gap)),mid=hh/2,x0=(w-(n*(bw+gap)-gap))/2;
  const live=R?R.live:[];
  for(let i=0;i<n;i++){
    const idx=live.length-(n-i),v=idx>=0?live[idx]:0;
    const bh=Math.max(bw,v*hh*0.92);
    g.fillStyle=R&&R.state==='rec'&&i>=n-2?C.rec:(R?C.wave:C['wave-dim']);
    rrect(g,x0+i*(bw+gap),mid-bh/2,bw,bh,bw/2);g.fill();
  }
}
function micError(e){
  const n=e&&e.name;
  if(n==='NotAllowedError'||n==='SecurityError')info('اجازه‌ی میکروفون داده نشده','برای ضبط باید به میکروفون اجازه بدهید. روی قفل کنار آدرس بزنید، «میکروفون» را روی «اجازه» بگذارید و صفحه را دوباره باز کنید.');
  else if(n==='NotFoundError')info('میکروفون پیدا نشد','میکروفونی روی این دستگاه پیدا نشد.');
  else info('میکروفون در دسترس نیست','شاید برنامه‌ی دیگری از میکروفون استفاده می‌کند. آن را ببندید و دوباره امتحان کنید.');
}

/* ---------- sheets ---------- */
function sheet(content,o={}){

function openSave(p){
  const input=h('input',{class:'field',type:'text',value:defaultName(p.created),maxlength:'80',autocomplete:'off','aria-label':'نام ضبط',enterkeyhint:'done'});
  let sure=false,saving=false;

    if(!sure){sure=true;delBtn.classList.add('sure');delBtn.textContent='بله، این ضبط حذف شود';return}
    clearDraft(p.sid);s.close();toast('ضبط حذف شد');
  }},'حذف این ضبط');
  const saveBtn=h('button',{class:'btn primary',onclick:save},'ذخیره');
  async function save(){
    if(saving)return;saving=true;saveBtn.disabled=true;
    const rec={id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:input.value.trim()||defaultName(p.created),created:p.created,duration:p.duration,size:p.blob.size,mime:p.mime,bps:p.bps,peaks:p.peaks,blob:p.blob};
    try{await idb.put('recs',rec)}
    catch(e){saving=false;saveBtn.disabled=false;info('ذخیره نشد','حافظه‌ی مرورگر پر است یا اجازه‌ی ذخیره‌سازی ندارد. چند ضبط قدیمی را حذف کنید و دوباره امتحان کنید.');return}
    await clearDraft(p.sid);

  }

  const s=sheet(h('div',null,
    h('h2',null,'ذخیره‌ی ضبط'),
    h('p',{class:'sub'},'یک نام بگذارید تا بعداً راحت پیدایش کنید. ',h('span',{class:'num'},fmtClock(p.duration)),' · ',fmtSize(p.blob.size)),
    input,
    h('div',{class:'stack'},saveBtn,delBtn)
  ),{dismiss:false});
  setTimeout(()=>{input.focus();input.select()},120);
}

async function checkDrafts(){
  if(R)return;
  let ds=[];try{ds=await idb.all('draft')}catch(e){return}
  for(const d of ds){
    const cs=await idb.range('chunks',d.sid+':',d.sid+':￿');
    if(!cs.length){await idb.del('draft',d.sid);continue}
    cs.sort((a,b)=>a.id<b.id?-1:1);
    const blob=new Blob(cs.map(c=>c.blob),{type:d.mime});
    const s=sheet(h('div',null,
      h('h2',null,'یک ضبط ناتمام پیدا شد'),
      h('p',{class:'sub'},'ظاهراً برنامه وسط ضبط بسته شده بود. حدود ',h('span',{class:'num'},fmtClock(d.duration)),' از آن ذخیره شده است.'),
      h('div',{class:'stack'},
        h('button',{class:'btn primary',onclick:()=>{s.close();openSave({blob,duration:d.duration,peaks:d.peaks||[],mime:d.mime,bps:d.bps,created:d.created,sid:d.sid})}},'بازیابی و ذخیره'),
        h('button',{class:'btn danger',onclick:()=>{clearDraft(d.sid);s.close()}},'حذف')

/* ---------- audio helpers ---------- */
function prepAudio(a){
  return new Promise(res=>{
    let fin=false;const done=()=>{if(!fin){fin=true;res()}};
    a.addEventListener('loadedmetadata',()=>{
      if(a.duration===Infinity||isNaN(a.duration)){
        const on=()=>{a.removeEventListener('timeupdate',on);try{a.currentTime=0}catch(e){}done()};
        a.addEventListener('timeupdate',on);
        try{a.currentTime=1e101}catch(e){done()}
      }else done();
    },{once:true});
    a.addEventListener('error',done,{once:true});
    setTimeout(done,4000);
  });
}
function seekTo(a,t){
  return new Promise(res=>{
    if(Math.abs(a.currentTime-t)<0.01){res();return}
    const on=()=>{a.removeEventListener('seeked',on);res()};
    a.addEventListener('seeked',on);
    try{a.currentTime=t}catch(e){res()}
    setTimeout(res,1500);
  });
}
function download(file){
  const u=URL.createObjectURL(file),a=h('a',{href:u,download:file.name});
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);
}
function fileOf(rec){return new File([rec.blob],safeName(rec.name)+'.'+extOf(rec.mime),{type:rec.blob.type||rec.mime})}
function b64Of(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>rej(fr.error);fr.readAsDataURL(blob)})}
async function sendNative(rec,mode){
  const f=fileOf(rec),B=window.NativeBridge,CH=3*180000;
  B.begin(f.name,f.type||'audio/webm');
  for(let o=0;o<f.size;o+=CH)B.chunk(await b64Of(f.slice(o,o+CH)));
  return B.finish(mode);
}
async function saveRec(rec){
  if(window.NativeBridge){
    try{const ok=await sendNative(rec,'save');toast(ok?'در پوشه‌ی Download/Sedanegar ذخیره شد':'ذخیره نشد')}catch(e){toast('ذخیره نشد')}
    return;
  }
  download(fileOf(rec));toast('فایل روی گوشی ذخیره شد');
}
async function shareRec(rec){
  if(window.NativeBridge){
    try{const ok=await sendNative(rec,'share');if(!ok)toast('ارسال نشد')}catch(e){toast('ارسال نشد')}
    return;
  }
  const f=fileOf(rec);
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:rec.name});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  download(f);toast('فایل روی گوشی ذخیره شد');
}

/* ---------- player ---------- */
function openPlayer(rec){
  const dur=rec.duration;
  let a=new Audio(),url=URL.createObjectURL(rec.blob),raf=0,speed=1,drag=false;
  a.preload='auto';a.src=url;
  const ready=prepAudio(a);
  const cv=h('canvas',{'aria-label':'نمودار صدا'});
  const head=h('div',{class:'playhead',style:'left:0'});
  const box=h('div',{class:'wavebox'},cv,head);
  const tCur=h('span',null,fmtClock(0)),tTot=h('span',null,fmtClock(dur));
  const playBtn=h('button',{class:'round big','aria-label':'پخش'},ico('play'));
  const speedBtn=h('button',{class:'round','aria-label':'سرعت پخش'},'۱×');
  const back=h('button',{class:'round','aria-label':'ده ثانیه عقب'},'−۱۰');
  const fwd=h('button',{class:'round','aria-label':'ده ثانیه جلو'},'+۱۰');
  const cur=()=>a.currentTime||0;
  function paint(){
    const f=clamp(cur()/dur,0,1);
    drawBars(cv,rec.peaks||[],t=>t<=f?C.teal:C['wave-dim'],{bw:3,gap:2});
    head.style.left=(f*100)+'%';tCur.textContent=fmtClock(cur());
  }
  function tick(){paint();if(!a.paused)raf=requestAnimationFrame(tick)}
  function setIcon(){playBtn.replaceChildren(ico(a.paused?'play':'pause'));playBtn.setAttribute('aria-label',a.paused?'پخش':'مکث')}
  playBtn.onclick=async()=>{
    await ready;
    if(a.paused){if(cur()>=dur-0.1)await seekTo(a,0);try{await a.play()}catch(e){}cancelAnimationFrame(raf);tick()}
    else a.pause();
    setIcon();
  };
  a.addEventListener('ended',()=>{setIcon();paint()});
  a.addEventListener('pause',setIcon);a.addEventListener('play',setIcon);
  back.onclick=async()=>{await ready;a.currentTime=clamp(cur()-10,0,dur);paint()};
  fwd.onclick=async()=>{await ready;a.currentTime=clamp(cur()+10,0,dur);paint()};
  speedBtn.onclick=()=>{const L=[1,1.5,2,0.75];speed=L[(L.indexOf(speed)+1)%L.length];a.playbackRate=speed;speedBtn.textContent=fa(speed)+'×'};
  async function seekX(ev){const r=box.getBoundingClientRect();await ready;a.currentTime=clamp((ev.clientX-r.left)/r.width,0,1)*dur;paint()}
  box.addEventListener('pointerdown',e=>{drag=true;box.setPointerCapture(e.pointerId);seekX(e)});
  box.addEventListener('pointermove',e=>{if(drag)seekX(e)});
  box.addEventListener('pointerup',()=>{drag=false});
  box.addEventListener('pointercancel',()=>{drag=false});
  function closeAll(){cancelAnimationFrame(raf);try{a.pause()}catch(e){}URL.revokeObjectURL(url);s.close()}
  const s=sheet(h('div',null,
    h('h2',null,rec.name),
    h('p',{class:'sub'},dfFull.format(rec.created),' · ',fmtSize(rec.size)),
    box,h('div',{class:'times'},tCur,tTot),
    h('div',{class:'transport'},back,playBtn,fwd,speedBtn),
    h('div',{class:'two',style:'margin-top:10px'},
      h('button',{class:'btn',onclick:()=>{closeAll();openTrim(rec)}},ico('cut'),'برش'),
      h('button',{class:'btn',onclick:()=>{closeAll();openRename(rec,()=>openPlayer(rec))}},ico('pen'),'تغییر نام')),
    h('div',{class:'two',style:'margin-top:10px'},
      h('button',{class:'btn',onclick:()=>shareRec(rec)},ico('share'),'ارسال'),
      h('button',{class:'btn',onclick:()=>saveRec(rec)},ico('save'),'ذخیره در گوشی')),
    h('div',{class:'stack'},h('button',{class:'btn danger',onclick:()=>{closeAll();openDelete(rec)}},ico('trash'),'حذف'))
  ),{onClose:()=>{cancelAnimationFrame(raf);try{a.pause()}catch(e){}try{URL.revokeObjectURL(url)}catch(e){}}});
  requestAnimationFrame(paint);
}
function openRename(rec,after){
  const input=h('input',{class:'field',type:'text',value:rec.name,maxlength:'80',autocomplete:'off','aria-label':'نام ضبط',enterkeyhint:'done'});
  async function save(){
    rec.name=input.value.trim()||rec.name;
    try{await idb.put('recs',rec)}catch(e){}
    s.close();renderLib();toast('نام تغییر کرد');after&&after();
  }
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();save()}});
  const s=sheet(h('div',null,h('h2',null,'تغییر نام'),input,
    h('div',{class:'stack'},h('button',{class:'btn primary',onclick:save},'ذخیره'),h('button',{class:'btn',onclick:()=>{s.close();after&&after()}},'انصراف'))));
  setTimeout(()=>{input.focus();input.select()},120);
}
function openDelete(rec){
  const s=sheet(h('div',null,h('h2',null,'حذف این ضبط؟'),h('p',{class:'sub'},`«${rec.name}» برای همیشه پاک می‌شود.`),
    h('div',{class:'stack'},
      h('button',{class:'btn danger sure',onclick:async()=>{try{await idb.del('recs',rec.id)}catch(e){}s.close();await refreshLib();toast('حذف شد')}},'بله، حذف شود'),
      h('button',{class:'btn',onclick:()=>s.close()},'انصراف'))));
}

/* ---------- trim ---------- */
async function renderSegments(rec,segs,onProgress,token){
  const AC=window.AudioContext||window.webkitAudioContext;
  const ctx=new AC();try{ctx.resume()}catch(e){}
  const a=new Audio();a.preload='auto';
  const url=URL.createObjectURL(rec.blob);a.src=url;
  try{
    await prepAudio(a);
    const src=ctx.createMediaElementSource(a),dest=ctx.createMediaStreamDestination();
    src.connect(dest);
    const mime=pickMime();let mr;
    try{mr=new MediaRecorder(dest.stream,{mimeType:mime||undefined,audioBitsPerSecond:rec.bps||32000})}catch(e){mr=new MediaRecorder(dest.stream)}
    const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    const stopped=new Promise(r=>{mr.onstop=r});
    mr.start();mr.pause();
    const total=segs.reduce((x,[p,q])=>x+(q-p),0);let done=0;
    for(const [p,q] of segs){
      if(token.cancelled)break;
      await seekTo(a,p);
      mr.resume();
      try{await a.play()}catch(e){}
      await new Promise(res=>{
        let iv=0;const fin=()=>{clearInterval(iv);res()};
        iv=setInterval(()=>{
          const c=Math.max(0,a.currentTime-p);
          onProgress(Math.min(1,(done+c)/total),Math.max(0,total-done-c));
          if(token.cancelled||a.currentTime>=q-0.03||a.ended)fin();
        },40);
        a.addEventListener('ended',fin,{once:true});
      });
      a.pause();mr.pause();done+=q-p;
    }
    try{mr.stop()}catch(e){}
    await stopped;
    if(token.cancelled)return null;
    const type=mr.mimeType||mime||rec.mime;
    return {blob:new Blob(chunks,{type}),duration:total,mime:type};
  }finally{
    try{a.pause()}catch(e){}URL.revokeObjectURL(url);try{ctx.close()}catch(e){}
  }
}
function slicePeaks(peaks,segs){
  const out=[];
  for(const [p,q] of segs){const a=Math.floor(p*PEAK_HZ),b=Math.ceil(q*PEAK_HZ);for(let i=a;i<b;i++)out.push(peaks[i]||0)}
  return out;
}
function openTrim(rec){
  const dur=rec.duration,MIN=0.5;
  let s0=0,e0=dur,mode='keep',pa=null,pUrl=null,pRaf=0;
  const cv=h('canvas');
  const band=h('div',{class:'band'});
  const head=h('div',{class:'playhead',style:'display:none'});
  const hs=h('div',{class:'hdl','aria-label':'نقطه‌ی شروع'}),he=h('div',{class:'hdl','aria-label':'نقطه‌ی پایان'});
  const box=h('div',{class:'wavebox'},cv,band,head,hs,he);
  const vS=h('div',{class:'val'}),vE=h('div',{class:'val'}),result=h('div',{class:'result'});
  const prevBtn=h('button',{class:'btn'},ico('play'),'شنیدن بخش انتخاب‌شده');
  const keepBtn=h('button',{role:'radio','aria-checked':'true'},'نگه‌داشتن این بخش');
  const delBtn=h('button',{role:'radio','aria-checked':'false'},'حذف این بخش');
  const newBtn=h('button',{class:'btn primary'},'ذخیره به‌عنوان ضبط جدید');
  const repBtn=h('button',{class:'btn'},'جایگزین ضبط اصلی');
  function segs(){return mode==='keep'?[[s0,e0]]:[[0,s0],[e0,dur]].filter(([p,q])=>q-p>0.05)}
  function resLen(){return segs().reduce((x,[p,q])=>x+(q-p),0)}
  function update(){
    const fs=s0/dur,fe=e0/dur;
    hs.style.left=(fs*100)+'%';he.style.left=(fe*100)+'%';
    band.style.left=(fs*100)+'%';band.style.width=((fe-fs)*100)+'%';
    vS.textContent=fmtClock(s0);vE.textContent=fmtClock(e0);
    drawBars(cv,rec.peaks||[],t=>{const x=t*dur,inside=x>=s0&&x<=e0;return mode==='keep'?(inside?C.teal:C['wave-dim']):(inside?C.rec:C.teal)},{bw:3,gap:2});
    const L=resLen(),ok=L>=MIN;
    result.textContent=ok?`طول فایل نتیجه: ${fmtClock(L)}`:'بخش انتخاب‌شده خیلی کوتاه است';
    newBtn.disabled=!ok;repBtn.disabled=!ok;
  }
  function setMode(m){
    mode=m;keepBtn.setAttribute('aria-checked',String(m==='keep'));delBtn.setAttribute('aria-checked',String(m==='del'));
    if(m==='del'&&s0<=0.01&&e0>=dur-0.01){s0=dur*0.4;e0=dur*0.6}
    update();
  }
  keepBtn.onclick=()=>setMode('keep');delBtn.onclick=()=>setMode('del');
  function drag(el,which){
    let on=false;
    el.addEventListener('pointerdown',e=>{on=true;el.setPointerCapture(e.pointerId);e.preventDefault()});
    el.addEventListener('pointermove',e=>{
      if(!on)return;
      const r=box.getBoundingClientRect(),t=clamp((e.clientX-r.left)/r.width,0,1)*dur;
      if(which==='s')s0=Math.min(t,e0-MIN);else e0=Math.max(t,s0+MIN);
      s0=Math.max(0,s0);e0=Math.min(dur,e0);update();
    });
    const up=()=>{on=false};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  }
  drag(hs,'s');drag(he,'e');
  function nudge(which,d){
    if(which==='s')s0=clamp(s0+d,0,e0-MIN);else e0=clamp(e0+d,s0+MIN,dur);
    update();
  }
  const nb=(which,d,l)=>h('button',{onclick:()=>nudge(which,d),'aria-label':l},(d>0?'+':'−')+fa(Math.abs(d))+' ث');
  /* preview */
  async function preview(){
    if(pa&&!pa.paused){stopPrev();return}
    if(!pa){pa=new Audio();pUrl=URL.createObjectURL(rec.blob);pa.src=pUrl;await prepAudio(pa)}
    await seekTo(pa,s0);
    try{await pa.play()}catch(e){return}
    prevBtn.replaceChildren(ico('pause'),'توقف');head.style.display='';
    const tk=()=>{
      if(!pa||pa.paused){return}
      if(pa.currentTime>=e0){stopPrev();return}
      head.style.left=(pa.currentTime/dur*100)+'%';pRaf=requestAnimationFrame(tk);
    };
    tk();
  }
  function stopPrev(){
    cancelAnimationFrame(pRaf);try{pa&&pa.pause()}catch(e){}
    prevBtn.replaceChildren(ico('play'),'شنیدن بخش انتخاب‌شده');head.style.display='none';
  }
  prevBtn.onclick=preview;
  function cleanup(){stopPrev();try{pUrl&&URL.revokeObjectURL(pUrl)}catch(e){}pa=null;pUrl=null}

  /* export */
  async function exportIt(replace){
    cleanup();
    const sg=segs(),token={cancelled:false};
    const bar=h('i'),eta=h('p',{class:'sub',style:'text-align:center'},'در حال آماده‌سازی…');
    const body=h('div',null,
      h('h2',null,'در حال ساخت فایل'),
      h('p',{class:'sub'},'فایل جدید هم‌زمان با پخش بخش انتخاب‌شده فشرده می‌شود و به اندازه‌ی طول آن زمان می‌برد. صفحه را روشن و برنامه را باز نگه دارید.'),
      h('div',{class:'bar'},bar),eta,
      h('div',{class:'stack'},h('button',{class:'btn',onclick:()=>{token.cancelled=true}},'لغو')));
    box.closest('.sheet').replaceChildren(h('div',{class:'grip'}),body);
    requestWake();
    let out=null,err=null;
    try{out=await renderSegments(rec,sg,(f,left)=>{bar.style.width=(f*100)+'%';eta.textContent=`حدود ${fmtClock(Math.ceil(left))} باقی مانده`},token)}catch(e){err=e}
    releaseWake();
    if(token.cancelled){sheetT.close();openTrim(rec);return}
    if(err||!out||!out.blob.size){sheetT.close();info('برش انجام نشد','مشکلی در ساخت فایل پیش آمد. دوباره امتحان کنید.');return}
    const nr={id:replace?rec.id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      name:replace?rec.name:rec.name+' (برش‌خورده)',created:replace?rec.created:Date.now(),
      duration:out.duration,size:out.blob.size,mime:out.mime,bps:rec.bps,peaks:slicePeaks(rec.peaks||[],sg),blob:out.blob};
    try{await idb.put('recs',nr)}catch(e){sheetT.close();info('ذخیره نشد','حافظه‌ی مرورگر پر است.');return}
    sheetT.close();await refreshLib();setTab('lib');toast(replace?'ضبط اصلی جایگزین شد':'ضبط جدید ذخیره شد');
  }
  newBtn.onclick=()=>exportIt(false);
  const rep=()=>{
    repBtn.textContent='مطمئنید؟ ضبط اصلی عوض می‌شود';repBtn.classList.add('danger','sure');
    repBtn.onclick=()=>exportIt(true);
  };
  repBtn.onclick=rep;

  const sheetT=sheet(h('div',null,
    h('h2',null,'برش «'+rec.name+'»'),
    h('p',{class:'sub'},'دستگیره‌های زرد را بکشید یا با دکمه‌ها دقیق‌تر تنظیم کنید.'),
    h('div',{class:'seg',role:'radiogroup'},keepBtn,delBtn),
    box,
    h('div',{class:'trimrow'},
      h('div',{class:'trimcol'},h('div',{class:'lbl'},'شروع'),vS,h('div',{class:'nudge'},nb('s',-1,'یک ثانیه عقب‌تر'),nb('s',1,'یک ثانیه جلوتر'))),
      h('div',{class:'trimcol'},h('div',{class:'lbl'},'پایان'),vE,h('div',{class:'nudge'},nb('e',-1,'یک ثانیه عقب‌تر'),nb('e',1,'یک ثانیه جلوتر')))),
    result,
    h('div',{class:'stack'},prevBtn,newBtn,repBtn,h('button',{class:'btn',onclick:()=>{cleanup();sheetT.close();openPlayer(rec)}},'بازگشت'))
  ),{dismiss:false,onClose:cleanup});
  requestAnimationFrame(update);
}

/* ---------- wiring ---------- */
$('#btnMain').onclick=()=>{if(!R)startRec();else if(R.state==='rec')pauseRec();else resumeRec()};
$('#btnStop').replaceChildren(ico('stop'));$('#btnStop').onclick=stopRec;
$('#btnCancel').onclick=()=>{
  const s=sheet(h('div',null,h('h2',null,'ضبط دور انداخته شود؟'),h('p',{class:'sub'},'آنچه تا الان ضبط شده پاک می‌شود.'),
    h('div',{class:'stack'},
      h('button',{class:'btn danger sure',onclick:()=>{s.close();discardRec()}},'بله، دور بینداز'),
      h('button',{class:'btn',onclick:()=>s.close()},'ادامه‌ی ضبط'))));
};
$('#tabRec').onclick=()=>setTab('rec');
$('#tabLib').onclick=()=>setTab('lib');
$('#search').addEventListener('input',renderLib);
window.addEventListener('resize',()=>{if(S.tab==='rec')drawLive();else renderLib()});
const mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
if(mq&&mq.addEventListener)mq.addEventListener('change',()=>{readColors();S.tab==='rec'?drawLive():renderLib()});

readColors();
renderRecUI();
setTab('rec');
refreshLib().then(checkDrafts);
</script>
